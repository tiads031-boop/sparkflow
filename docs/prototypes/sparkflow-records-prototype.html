="true" aria-label="${layer==='edit'?'编辑记录':'新建随手记'}"><header class="note-top"><button type="button" class="note-round" data-act="${layer==='edit'?'detail':'close'}" aria-label="返回${layer==='edit'?'记录详情':'记录列表'}" title="返回">${uiIcon.left}</button><div class="note-top-right"><span class="note-state">SPARKFLOW · 记录</span><button type="button" class="note-done" data-act="save">完成</button></div></header><div class="note-paper">${body}</div><div class="note-media-mask${mediaToolsOpen?' is-open':''}" id="noteMediaMask" aria-hidden="${!mediaToolsOpen}"><button type="button" class="note-media-backdrop" data-act="mediaDismiss" aria-label="关闭附件选择"></button><div class="note-media-tray" id="noteMediaTray" role="dialog" aria-modal="true" aria-label="添加内容"><div class="note-media-handle"></div><div class="note-media-head"><div><b>添加内容</b><small>为这条记录留下一点细节</small></div><button type="button" class="note-media-close" data-act="mediaDismiss" aria-label="关闭附件选择">${uiIcon.close}</button></div><div class="note-media-options"><button type="button" class="note-media-choice" data-upload="image"><span class="note-choice-icon photo-choice">${uiIcon.camera}</span><span class="note-choice-copy"><b>照片</b><small>让这一刻看得见</small></span><span class="note-choice-arrow">${uiIcon.right}</span></button><button type="button" class="note-media-choice" data-upload="video"><span class="note-choice-icon video-choice">${uiIcon.video}</span><span class="note-choice-copy"><b>视频</b><small>记录正在发生的画面</small></span><span class="note-choice-arrow">${uiIcon.right}</span></button><button type="button" class="note-media-choice" data-upload="audio"><span class="note-choice-icon audio-choice">${uiIcon.mic}</span><span class="note-choice-copy"><b>音频</b><small>把声音留在这里</small></span><span class="note-choice-arrow">${uiIcon.right}</span></button></div></div></div><div class="note-bottom"><div class="note-toolbar" role="toolbar" aria-label="记录工具"><button type="button" class="note-tool note-check-tool" data-act="checkLine" aria-label="插入圆形清单" title="圆形清单"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="check-disc" cx="5.5" cy="6.5" r="3"/><path class="check-tick" d="m4.35 6.4.9.95 1.5-1.7"/><path d="M11 6.5h9"/><circle class="check-empty" cx="5.5" cy="17.5" r="3"/><path d="M11 17.5h9"/></svg></button><button type="button" class="note-tool" data-act="mediaTools" aria-expanded="${mediaToolsOpen}" aria-controls="noteMediaTray" aria-label="添加图片、视频或音频" title="添加附件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12.5 5.9-5.9a3.3 3.3 0 0 1 4.7 4.7l-8.3 8.3a5 5 0 0 1-7.1-7.1L11 4.7"/></svg></button><button type="button" class="note-tool" data-act="tagOpen" aria-label="选择或创建标签" title="标签"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11V4.5h6.6L20 14.4l-5.6 5.6L4.5 10a2 2 0 0 1-1-1.7Z"/><circle cx="7.8" cy="7.8" r="1.2"/></svg></button></div><button type="button" class="note-save" data-act="save" aria-label="保存记录" title="保存记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg></button></div><input type="file" id="media-image" accept="image/*" multiple hidden><input type="file" id="media-video" accept="video/*" multiple hidden><input type="file" id="media-audio" accept="audio/*" multiple hidden></section></div>`;return}
if(layer==='delete'){el.innerHTML=`<div class="scrim" data-scrim="1"><section class="sheet" role="dialog" aria-modal="true">${layerHeader('删除记录','此操作会删除这条记录及其回顾')}<div class="sheet-body"><div class="notice">确定删除「${escape(r.title||'未命名记录')}」？已转成的待办在真实产品中保留，并断开来源。</div></div><div class="sheet-foot"><button class="action light" data-act="detail">取消</button><button class="action danger" data-act="confirmDelete">删除记录</button></div></section></div>`;return}if(layer==='task'){el.innerHTML=`<div class="scrim" data-scrim="1"><section class="sheet" role="dialog" aria-modal="true">${layerHeader('转为待办','先确认内容，再创建行动')}<div class="sheet-body"><label class="field">待办标题<input id="taskTitle" value="${escape(r?.title||'整理记录中的想法')}"></label><p class="review-note">演示不会向真实账户写入待办；来源记录会保留。</p></div><div class="sheet-foot"><button class="action light" data-act="close">取消</button><button class="action" data-act="confirmTask">确认预览</button></div></section></div>`}}
function returnFromImage(){captionEditing=false;layer=imageReturnLayer;renderLayer();if((layer==='edit'||layer==='new')&&editorDraft){if(q('#title'))q('#title').value=editorDraft.title;if(q('#bodyText'))q('#bodyText').value=editorDraft.text}editorDraft=null}
function redrawEditorKeepingText(){let t=q('#title')?.value||'',b=q('#bodyText')?.value||'';renderLayer();if(q('#title'))q('#title').value=t;if(q('#bodyText'))q('#bodyText').value=b}
function saveEditor(){let title=q('#title')?.value.trim()||'',text=q('#bodyText')?.value.trim()||'';let r=records.find(x=>x.id===selected);let oldMedia=(r?.media||[]).map(x=>({...x}));if(!title&&!text&&!oldMedia.length&&!files.length){toast('请写一点内容或添加附件');return}let media=[...oldMedia,...files];if(!title)title=text.slice(0,16)||'新的记录';if(r){Object.assign(r,{title,text,tags:[...editTags],media});toast('记录已保存')}else{r={id:'r'+Date.now(),title,text,tags:[...editTags],media,date:new Date().toISOString(),source:'手动记录',reflections:[],task:null};records.unshift(r);toast('记录已保存')}save();selected=r.id;layer='detail';render()}
function processReview(action){let arr=records.filter(x=>!x.reviewed),r=arr[reviewIndex]||arr[0];if(!r)return;if(action==='save'){let t=q('#reviewText').value.trim();if(!t){toast('先写下新的理解');return}r.reflections.push({date:new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}),body:t});r.reviewed=true;toast('新的理解已保留，原记录未改变')}else if(action==='done'){r.reviewed=true;toast('已消化')}else{reviewIndex=(reviewIndex+1)%arr.length;toast('稍后再看')}save();render()}
document.addEventListener('click',e=>{let node=e.target.closest('[data-act],[data-panel],[data-mode],[data-open],[data-picture],[data-media],[data-chip],[data-remove],[data-scene],[data-scrim],[data-edit-photo],[data-pending-photo],[data-tag-option],[data-upload],[data-expand]');if(!node)return;let d=node.dataset;if(d.scrim&&node!==e.target)return;if(d.mode){mode=d.mode;panel=null;scene='';render();q('#scroll').scrollTop=0;return}if(d.panel){panel=panel===d.panel?null:d.panel;reviewIndex=0;render();return}if(d.scene){scene=d.scene;render();return}if(d.open){selected=d.open;layer='detail';renderLayer();return}if(d.expand){if(expandedRecords.has(d.expand))expandedRecords.delete(d.expand);else expandedRecords.add(d.expand);render();return}if(d.picture){let [id,i]=d.picture.split(':');selected=id;photoIndex=Number(i);photoSource='record';imageReturnLayer=layer;if(layer==='edit')editorDraft={title:q('#title')?.value||'',text:q('#bodyText')?.value||''};captionEditing=false;layer='image';renderLayer();return}if(d.editPhoto!==undefined||d.pendingPhoto!==undefined){editorDraft={title:q('#title')?.value||'',text:q('#bodyText')?.value||''};photoSource=d.pendingPhoto!==undefined?'pending':'record';photoIndex=Number(d.pendingPhoto??d.editPhoto);imageReturnLayer=layer;captionEditing=false;layer='image';renderLayer();return}if(d.media){selected=d.media;layer='detail';renderLayer();return}if(d.upload){mediaToolsOpen=false;q('#noteMediaMask')?.classList.remove('is-open');q('#noteMediaMask')?.setAttribute('aria-hidden','true');q('#media-'+d.upload)?.click();return}if(d.tagOption!==undefined){let t=d.tagOption;editTags=editTags.includes(t)?editTags.filter(x=>x!==t):[...editTags,t];updateTagRows();const done=q('[data-act="tagDone"]');if(done)done.textContent=`完成 · 已选 ${editTags.length}`;return}if(d.chip){let t=d.chip;editTags=editTags.includes(t)?editTags.filter(x=>x!==t):[...editTags,t];node.classList.toggle('selected');return}if(d.remove!==undefined){files.splice(Number(d.remove),1);redrawEditorKeepingText();return}if(d.scrim){if(layer==='tagPicker')returnToEditor();else close();return}if(!d.act)return;switch(d.act){case 'new':layer='new';selected=null;files=[];editTags=[];mediaToolsOpen=false;renderLayer();break;case 'tagOpen':captureEditorDraft();tagReturnLayer=layer;tagQuery='';layer='tagPicker';renderLayer();q('#tagSearch')?.focus();break;case 'tagBack':case 'tagDone':returnToEditor();break;case 'tagCreate':{let t=tagQuery.trim().replace(/^#/,'');if(!t){toast('输入标签名称');break}if(t.length>20){toast('标签名称请控制在 20 字以内');break}let existing=allTags().find(x=>x.toLowerCase()===t.toLowerCase());t=existing||t;if(!existing){customTags.push(t);try{localStorage.setItem('sf-records-custom-tags',JSON.stringify(customTags))}catch{}}if(!editTags.includes(t))editTags.push(t);tagQuery='';q('#tagSearch').value='';updateTagRows();const done=q('[data-act="tagDone"]');if(done)done.textContent=`完成 · 已选 ${editTags.length}`;toast(`已选择 #${t}`);break}case 'close':if(layer==='image'){returnFromImage()}else if(layer==='tagPicker')returnToEditor();else close();break;case 'photoEdit':captionEditing=true;renderLayer();q('#photoCaption')?.focus();break;case 'photoCancel':captionEditing=false;renderLayer();break;case 'photoSave':{let m=photoSource==='pending'?files.filter(x=>x.kind==='image')[photoIndex]:photos(records.find(x=>x.id===selected))[photoIndex];m.caption=q('#photoCaption')?.value.trim()||'';captionEditing=false;if(photoSource==='record'){save();render()}renderLayer();toast('照片备注已保存');break}case 'detail':layer='detail';renderLayer();break;case 'edit':{let r=records.find(x=>x.id===selected);editTags=[...r.tags];files=[];mediaToolsOpen=false;layer='edit';renderLayer();break}case 'mediaTools':{mediaToolsOpen=!mediaToolsOpen;q('#noteMediaMask').classList.toggle('is-open',mediaToolsOpen);q('#noteMediaMask').setAttribute('aria-hidden',String(!mediaToolsOpen));node.setAttribute('aria-expanded',String(mediaToolsOpen));break}case 'mediaDismiss':{mediaToolsOpen=false;q('#noteMediaMask').classList.remove('is-open');q('#noteMediaMask').setAttribute('aria-hidden','true');q('[data-act="mediaTools"]')?.setAttribute('aria-expanded','false');break}case 'checkLine':{const area=q('#bodyText');if(!area)break;const start=area.selectionStart,end=area.selectionEnd;const line=area.value.lastIndexOf('\n',start-1)+1;const prefix=area.value.slice(line,line+2);if(prefix==='◯ '||prefix==='☐ '){area.setRangeText('',line,line+2,'preserve');area.setSelectionRange(Math.max(line,start-2),Math.max(line,end-2))}else{area.setRangeText('◯ ',line,line,'preserve');area.setSelectionRange(start+2,end+2)}area.focus();break}case 'save':saveEditor();break;case 'delete':layer='delete';renderLayer();break;case 'confirmDelete':records=records.filter(x=>x.id!==selected);save();close();render();toast('记录已删除');break;case 'task':if(panel==='review'&&!layer){let a=records.filter(x=>!x.reviewed);selected=(a[reviewIndex]||a[0])?.id}layer='task';renderLayer();break;case 'confirmTask':toast('已完成待办创建流程预览');close();break;case 'back':panel=null;render();break;case 'sceneBack':scene='';render();break;case 'refresh':render();toast('记录已刷新');break;case 'reviewSave':processReview('save');break;case 'reviewLater':processReview('later');break;case 'reviewDone':processReview('done');break;case 'reviewMore':records.forEach(r=>delete r.reviewed);reviewIndex=0;render();break;case 'insightSource':{let r=records.find(x=>x.id==='5');if(r){selected=r.id;layer='detail';renderLayer()}break}case 'insightGenerate':toast('原型展示既有入口，生成需要连接 AI 服务');break;case 'previous':case 'next':{if(captionEditing){toast('请先保存或取消照片备注');break}let n=(photoSource==='pending'?files.filter(x=>x.kind==='image'):photos(records.find(x=>x.id===selected))).length;photoIndex=(photoIndex+(d.act==='next'?1:-1)+n)%n;captionEditing=false;renderLayer();break}}});

document.addEventListener('input',e=>{if(e.target.id==='tagSearch'){tagQuery=e.target.value;updateTagRows()}});
document.addEventListener('change',e=>{if(!e.target.id?.startsWith('media-'))return;let selectedFiles=[...e.target.files];if(files.length+selectedFiles.length>6){toast('每条记录最多 6 个附件');return}let name=q('#title')?.value||'',body=q('#bodyText')?.value||'';Promise.all(selectedFiles.map(file=>new Promise(resolve=>{if(file.size>5*1024*1024){toast('原型单个附件请小于 5 MB');resolve(null);return}const reader=new FileReader();reader.onload=()=>resolve({kind:file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':'audio',data:reader.result,name:file.name,caption:''});reader.onerror=()=>resolve(null);reader.readAsDataURL(file)}))).then(a=>{files.push(...a.filter(Boolean));renderLayer();q('#title').value=name;q('#bodyText').value=body})});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='bodyText'&&(layer==='edit'||layer==='new')){const area=e.target,pos=area.selectionStart,line=area.value.lastIndexOf('\n',pos-1)+1,part=area.value.slice(line,pos);if(part.startsWith('◯ ')){e.preventDefault();if(part.trim()==='◯'){area.setRangeText('',line,pos,'end')}else{area.setRangeText('\n◯ ',area.selectionStart,area.selectionEnd,'end')}return}}if(e.key==='Escape'&&mediaToolsOpen&&(layer==='edit'||layer==='new')){mediaToolsOpen=false;q('#noteMediaMask')?.classList.remove('is-open');q('#noteMediaMask')?.setAttribute('aria-hidden','true');q('[data-act="mediaTools"]')?.setAttribute('aria-expanded','false');return}if(e.key==='Escape'&&layer){if(layer==='tagPicker'){returnToEditor()}else if(layer==='image'&&captionEditing){captionEditing=false;renderLayer()}else if(layer==='image')returnFromImage();else close()}if(layer==='image'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){if(captionEditing)return;let n=(photoSource==='pending'?files.filter(x=>x.kind==='image'):photos(records.find(x=>x.id===selected))).length;photoIndex=(photoIndex+(e.key==='ArrowRight'?1:-1)+n)%n;captionEditing=false;renderLayer()}});


let swipeStart=null;
document.addEventListener('touchstart',e=>{if(layer!=='image'||captionEditing||!e.target.closest('.photo-canvas'))return;swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(!swipeStart||layer!=='image'||captionEditing)return;const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3){const pics=photoSource==='pending'?files.filter(m=>m.kind==='image'):photos(records.find(r=>r.id===selected));if(pics.length>1){photoIndex=(photoIndex+(dx<0?1:-1)+pics.length)%pics.length;renderLayer()}}},{passive:true});

function fmt(seconds){let n=Math.floor(Number.isFinite(seconds)?seconds:0);return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
document.addEventListener('click',e=>{let play=e.target.closest('[data-voice]');if(play){let key=play.dataset.voice,a=document.querySelector(`[data-audio="${key}"]`);if(!a){toast('示例波形仅展示样式；添加真实语音后可播放');return}if(a.paused){document.querySelectorAll('audio[data-audio]').forEach(x=>{if(x!==a)x.pause()});a.play().catch(()=>toast('当前浏览器无法播放这个音频格式'))}else a.pause();return}let bar=e.target.closest('[data-wave]');if(bar){let a=document.querySelector(`[data-audio="${bar.dataset.wave}"]`);if(a?.duration){let rect=bar.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(a.duration,(e.clientX-rect.left)/rect.width*a.duration))}else toast('添加真实语音后可拖动进度');return}let video=e.target.closest('[data-video-play]');if(video){let key=video.dataset.videoPlay,box=document.querySelector(`[data-video-box="${key}"]`),player=box?.querySelector('video');if(!player?.getAttribute('src')){toast('添加视频后即可在卡片内播放');return}box.classList.add('playing');player.play().catch(()=>toast('当前浏览器无法播放这个视频格式'))}},true);
document.addEventListener('timeupdate',e=>{if(!e.target.matches('audio[data-audio]'))return;let a=e.target,k=a.dataset.audio,v=a.duration?Math.min(1,a.currentTime/a.duration):0;document.querySelectorAll(`[data-wave="${k}"]`).forEach(w=>[...w.children].forEach((bar,i)=>bar.classList.toggle('played',i/Math.max(1,w.children.length-1)<=v)));document.querySelectorAll(`[data-time="${k}"]`).forEach(t=>t.textContent=`${fmt(a.currentTime)} / ${fmt(a.duration)}`)},true);
document.addEventListener('play',e=>{if(!e.target.matches('audio[data-audio]'))return;document.querySelectorAll(`[data-voice="${e.target.dataset.audio}"]`).forEach(b=>{b.textContent='Ⅱ';b.setAttribute('aria-label','暂停语音')})},true);
document.addEventListener('pause',e=>{if(!e.target.matches('audio[data-audio]'))return;document.querySelectorAll(`[data-voice="${e.target.dataset.audio}"]`).forEach(b=>{b.textContent='▶';b.setAttribute('aria-label','播放语音')})},true);

render();
})();
</script></body></html>
