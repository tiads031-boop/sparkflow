<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkFlow V4 — Dashboard & Calendar 交互原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --phone-w: 393px;
      --phone-h: 852px;
      --card-radius: 16px;
      --card-gap: 7px;
      --col-gap: 12px;
      --c-dark: #242424;
      --c-green: #cae393;
      --c-purple: #b0a8db;
      --c-bg: #f4f4f6;
      --hour-height: 80px;
      --timeline-start: 7;
      --timeline-end: 23;
      --snap-min: 15;
      --task-block-radius: 14px;
      --header-expanded: 1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .phone-frame {
      width: var(--phone-w);
      height: var(--phone-h);
      background: var(--c-bg);
      border-radius: 40px;
      border: 6px solid #333;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Page enter animation */
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-page-enter { animation: pageEnter 0.35s ease-out both; }

    /* Bottom sheet */
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-enter { animation: sheetUp 0.3s cubic-bezier(0.32,0.72,0.6,1) both; }

    /* Param panel */
    .param-panel {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 16px;
      z-index: 1000;
      max-height: 80vh;
      overflow-y: auto;
      transition: all 0.3s ease;
    }
    .param-panel.collapsed {
      width: 44px;
      padding: 10px 6px;
      overflow: hidden;
    }
    .param-panel.collapsed .panel-body { display: none; }
    .param-panel.collapsed .panel-header span { display: none; }

    /* Range slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #e5e7eb;
      outline: none;
      margin: 6px 0 12px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--c-purple);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* Timeline */
    .timeline-container {
      position: relative;
      min-height: calc((var(--timeline-end) - var(--timeline-start)) * var(--hour-height));
    }
    .time-ruler-line {
      position: absolute;
      left: 48px;
      right: 0;
      height: 1px;
      background: rgba(0,0,0,0.06);
    }
    .time-label {
      position: absolute;
      left: 0;
      width: 40px;
      text-align: right;
      font-size: 10px;
      color: #9ca3af;
      transform: translateY(-50%);
    }
    .task-block {
      position: absolute;
      left: 56px;
      right: 8px;
      border-radius: var(--task-block-radius);
      padding: 8px 12px;
      cursor: grab;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      transition: box-shadow 0.2s, transform 0.1s;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .task-block:active { cursor: grabbing; z-index: 50 !important; }
    .task-block.dragging { box-shadow: 0 12px 40px rgba(0,0,0,0.18); transition: none; }
    .task-block .resize-handle {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      cursor: ns-resize;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2px;
    }
    .task-block .resize-handle::after {
      content: '';
      width: 24px;
      height: 3px;
      border-radius: 2px;
      background: rgba(0,0,0,0.12);
    }
    .task-block.is-dark { background: #242424; color: white; }
    .task-block.is-green { background: #cae393; color: #242424; }
    .task-block.is-purple { background: #b0a8db; color: #242424; }

    /* Chart bar hover */
    .chart-bar-group { transition: opacity 0.2s; }
    .chart-bar-group:hover { opacity: 0.85; }

    /* Day dot */
    .day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--c-green); }

    /* Mini pill buttons */
    .pill-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 13px;
      font-weight: 500;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn.active-green { background: var(--c-green); color: var(--c-dark); }
    .pill-btn.active-white { background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08); color: var(--c-dark); }
    .pill-btn.inactive { background: transparent; color: #9ca3af; }

    /* Current time line */
    .current-time-line {
      position: absolute;
      left: 48px;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--c-purple) 0%, transparent 100%);
      z-index: 20;
      pointer-events: none;
    }
    .current-time-line::before {
      content: '';
      position: absolute;
      left: -5px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--c-purple);
    }
  </style>
</head>
<body>

<!-- ==================== 手机框架 ==================== -->
<div class="phone-frame" id="phone">

  <!-- Header -->
  <div class="px-5 pt-6 pb-2 shrink-0 z-20 bg-[var(--c-bg)]">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="text-xl font-black tracking-tighter italic select-none" style="color:var(--c-dark)">
          SparkFlow<span style="color:var(--c-green)">.</span>
        </div>
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-green-50 text-green-600 border border-green-100 text-xs">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          <span class="font-bold">已同步</span>
        </div>
      </div>
      <div class="flex gap-2">
        <button class="w-9 h-9 rounded-full flex items-center justify-center text-white shadow-sm hover:scale-105 active:scale-95 transition-all" style="background:var(--c-dark)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto hide-scrollbar px-5 relative" id="contentArea">
    <!-- Views injected by JS -->
  </div>

  <!-- Bottom Nav -->
  <div class="shrink-0 pb-6 pt-2 z-40 flex justify-center" style="background:var(--c-bg)">
    <div class="flex items-center gap-1 px-2 py-2 rounded-full" style="background:var(--c-dark); box-shadow:0 20px 40px rgba(0,0,0,0.3)">
      <button data-tab="dashboard" class="nav-btn relative p-3 rounded-full transition-all duration-300 text-gray-400 hover:text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button data-tab="tasks" class="nav-btn relative p-3 rounded-full transition-all duration-300 text-gray-400 hover:text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </button>
      <button data-tab="board" class="nav-btn relative p-3 rounded-full transition-all duration-300 text-gray-400 hover:text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </button>
      <button data-tab="calendar" class="nav-btn relative p-3 rounded-full transition-all duration-300 text-gray-400 hover:text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </button>
      <button data-tab="sparks" class="nav-btn relative p-3 rounded-full transition-all duration-300 text-gray-400 hover:text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </div>
  </div>

  <!-- Dark Overlay Modal (Task Edit) -->
  <div id="taskModal" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end">
    <div class="w-full rounded-t-[2.5rem] p-6 sheet-enter" style="background:var(--c-dark); max-height:70%; overflow-y:auto;">
      <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-5"></div>
      <div class="flex justify-between items-center mb-4">
        <span class="text-[10px] font-bold tracking-widest uppercase" style="color:var(--c-green)">Task Details</span>
        <button onclick="closeTaskModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <h3 id="modalTitle" class="text-xl font-bold text-white mb-4"></h3>
      <div class="space-y-3 mb-6">
        <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
          <div class="flex items-center gap-3 text-white mb-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--c-green)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="text-sm font-medium">开始时间</span>
          </div>
          <p id="modalStart" class="text-xs text-white/50 ml-9"></p>
        </div>
        <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
          <div class="flex items-center gap-3 text-white mb-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--c-purple)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="text-sm font-medium">预计时长</span>
          </div>
          <p id="modalDuration" class="text-xs text-white/50 ml-9"></p>
        </div>
      </div>
      <div class="flex gap-3">
        <button class="flex-1 py-3 rounded-full text-sm font-bold" style="background:var(--c-green); color:var(--c-dark)">保存</button>
        <button class="flex-1 py-3 rounded-full text-sm font-bold bg-white/10 text-white">删除</button>
      </div>
    </div>
  </div>

  <!-- Bottom Sheet: Chart Drill-down -->
  <div id="drillSheet" class="hidden absolute inset-0 z-50" style="pointer-events:none;">
    <div class="absolute inset-0 bg-black/30" style="pointer-events:auto;" onclick="closeDrillSheet()"></div>
    <div class="absolute bottom-0 left-0 right-0 rounded-t-[2rem] p-5 sheet-enter" style="background:var(--c-bg); max-height:55%; overflow-y:auto; pointer-events:auto;">
      <div class="w-10 h-1 rounded-full bg-gray-300 mx-auto mb-4"></div>
      <h3 id="drillTitle" class="text-sm font-bold mb-3" style="color:var(--c-dark)"></h3>
      <div id="drillList" class="space-y-2 pb-4"></div>
    </div>
  </div>

</div>

<!-- ==================== 参数调整面板 ==================== -->
<div class="param-panel" id="paramPanel">
  <div class="panel-header flex justify-between items-center mb-3">
    <span class="text-xs font-bold tracking-wide" style="color:var(--c-dark)">⚙ 参数面板</span>
    <button onclick="togglePanel()" class="w-6 h-6 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 transition-colors">
      <svg id="collapseIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>
  <div class="panel-body space-y-1">
    <label class="text-[10px] text-gray-400 font-medium">时间线每小时高度</label>
    <input type="range" id="paramHourHeight" min="50" max="140" value="80" oninput="onParamChange()">
    <div class="text-right text-[10px] text-gray-400 -mt-2 mb-2" id="valHourHeight">80px</div>

    <label class="text-[10px] text-gray-400 font-medium">时间线起始小时</label>
    <input type="range" id="paramStartHour" min="0" max="12" value="7" oninput="onParamChange()">
    <div class="text-right text-[10px] text-gray-400 -mt-2 mb-2" id="valStartHour">7:00</div>

    <label class="text-[10px] text-gray-400 font-medium">时间线结束小时</label>
    <input type="range" id="paramEndHour" min="13" max="24" value="23" oninput="onParamChange()">
    <div class="text-right text-[10px] text-gray-400 -mt-2 mb-2" id="valEndHour">23:00</div>

    <label class="text-[10px] text-gray-400 font-medium">拖拽磁吸粒度 (分钟)</label>
    <input type="range" id="paramSnap" min="5" max="60" step="5" value="15" oninput="onParamChange()">
    <div class="text-right text-[10px] text-gray-400 -mt-2 mb-2" id="valSnap">15min</div>

    <label class="text-[10px] text-gray-400 font-medium">任务块圆角</label>
    <input type="range" id="paramTaskRadius" min="4" max="24" value="14" oninput="onParamChange()">
    <div class="text-right text-[10px] text-gray-400 -mt-2 mb-2" id="valTaskRadius">14px</div>

    <label class="text-[10px] text-gray-400 font-medium">日历头默认展开</label>
    <div class="flex items-center justify-between py-1">
      <span class="text-xs text-gray-500" id="valHeader">展开</span>
      <button onclick="toggleHeaderDefault()" class="w-10 h-5 rounded-full relative transition-colors" id="headerToggle" style="background:var(--c-green)">
        <span class="absolute top-0.5 left-[22px] w-4 h-4 rounded-full bg-white shadow-sm transition-all" id="headerToggleKnob"></span>
      </button>
    </div>

    <label class="text-[10px] text-gray-400 font-medium mt-2">图表默认视图</label>
    <div class="flex gap-1 bg-gray-100 rounded-full p-0.5 mt-1">
      <button onclick="setDefaultChart('day')" id="btnDefDay" class="pill-btn inactive text-xs py-1">日</button>
      <button onclick="setDefaultChart('week')" id="btnDefWeek" class="pill-btn active-green text-xs py-1">周</button>
      <button onclick="setDefaultChart('month')" id="btnDefMonth" class="pill-btn inactive text-xs py-1">月</button>
    </div>

    <div class="pt-3 mt-2 border-t border-gray-100">
      <button onclick="exportJSON()" class="w-full py-2 rounded-xl text-xs font-bold text-white shadow-sm hover:opacity-90 transition-opacity" style="background:var(--c-dark)">
        📤 导出 JSON
      </button>
      <button onclick="resetParams()" class="w-full py-2 mt-2 rounded-xl text-xs font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition-colors">
        ↺ 重置
      </button>
    </div>
  </div>
</div>

<script>
// ==================== 数据 ====================
const tasks = [
  { id: 1, title: 'Web 应用注册流程设计', status: 'In progress', priority: 'High Priority', colorType: 'dark', start: '09:30', duration: 90, dayOffset: 0 },
  { id: 2, title: '竞品分析：Notion 数据库', status: 'To do', priority: 'Medium', colorType: 'green', start: '14:00', duration: 120, dayOffset: 0 },
  { id: 3, title: '管理面板仪表盘 UI', status: 'In review', priority: 'High Priority', colorType: 'purple', start: '10:00', duration: 60, dayOffset: 1 },
  { id: 4, title: 'API 接口联调', status: 'Done', priority: 'Medium', colorType: 'green', start: '15:30', duration: 90, dayOffset: 0 },
  { id: 5, title: '周报撰写', status: 'To do', priority: 'Low', colorType: 'purple', start: '19:00', duration: 45, dayOffset: 0 },
  { id: 6, title: '代码 Review', status: 'In progress', priority: 'High Priority', colorType: 'dark', start: '11:00', duration: 60, dayOffset: 2 },
];

const weekDays = ['一','二','三','四','五','六','日'];
let currentTab = 'dashboard';
let chartView = 'week';
let selectedDate = new Date();
let headerExpanded = true;
let defaultChartView = 'week';
let taskFilter = 'All';

// Drag state
let dragInfo = { id: null, type: null, startY: 0, startX: 0, origTop: 0, origHeight: 0, taskId: null };

// ==================== 工具函数 ====================
function getCSSVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function setCSSVar(name, val) { document.documentElement.style.setProperty(name, val); }
function pad(n) { return n.toString().padStart(2,'0'); }
function formatDate(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay() || 7;
  if(day !== 1) date.setHours(-24 * (day - 1));
  date.setHours(0,0,0,0);
  return date;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isSameDay(a,b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function parseTime(t) { const [h,m]=t.split(':').map(Number); return h+m/60; }
function snap(val, grain) { return Math.round(val / grain) * grain; }

// ==================== 导航 ====================
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTab = btn.dataset.tab;
    render();
  });
});

function updateNav() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const isActive = btn.dataset.tab === currentTab;
    btn.className = `nav-btn relative p-3 rounded-full transition-all duration-300 ${isActive ? 'bg-white' : 'text-gray-400 hover:text-white'}`;
    if(isActive) {
      btn.style.color = 'var(--c-dark)';
      // active dot
      let dot = btn.querySelector('.nav-dot');
      if(!dot) { dot = document.createElement('span'); dot.className='nav-dot absolute -top-0.5 right-0 w-2.5 h-2.5 rounded-full border-2'; dot.style.background='var(--c-green)'; dot.style.borderColor='var(--c-dark)'; btn.appendChild(dot);}
    } else {
      btn.style.color = '';
      const dot = btn.querySelector('.nav-dot');
      if(dot) dot.remove();
    }
  });
}

// ==================== Dashboard View ====================
function renderDashboard() {
  const inProgress = tasks.filter(t=>t.status==='In progress').length;
  const inReview = tasks.filter(t=>t.status==='In review').length;
  const todo = tasks.filter(t=>t.status==='To do').length;
  const total = tasks.filter(t=>t.status!=='Done').length;
  const done = tasks.filter(t=>t.status==='Done').length;

  // Bars data
  const bars = [];
  if(chartView === 'week') {
    const baseH = total > 0 ? Math.min(60, 20 + total*3) : 15;
    const ratios = [0.6,0.8,0.4,1.0,0.7,0.5,0.3];
    for(let i=0;i<7;i++) {
      const s = ratios[i];
      bars.push({
        h1: Math.min(Math.round(baseH*s*(done/Math.max(total,1)||0.3))+10, 85),
        h2: Math.min(Math.round(baseH*s*0.4)+5, 50),
        h3: Math.min(Math.round(baseH*s*0.3)+5, 40),
        label: weekDays[i],
        fullLabel: `周${weekDays[i]}`,
      });
    }
  } else if(chartView === 'day') {
    // Hourly view: 7~23
    for(let h=7; h<=23; h+=2) {
      const hourTasks = tasks.filter(t => {
        const st = parseTime(t.start);
        return st >= h && st < h+2;
      });
      const ratio = 0.3 + hourTasks.length * 0.25;
      bars.push({
        h1: Math.min(Math.round(40*ratio)+10, 75),
        h2: Math.min(Math.round(25*ratio)+5, 45),
        h3: Math.min(Math.round(15*ratio)+5, 30),
        label: `${h}`,
        fullLabel: `${h}:00-${h+2}:00`,
      });
    }
  } else {
    // Month view: days 1-30 simplified
    for(let d=1; d<=30; d+=3) {
      const dayTasks = tasks.filter(t => (t.dayOffset||0) === (d%7)); // simulate
      const ratio = 0.3 + dayTasks.length * 0.2;
      bars.push({
        h1: Math.min(Math.round(35*ratio)+8, 70),
        h2: Math.min(Math.round(20*ratio)+5, 40),
        h3: Math.min(Math.round(12*ratio)+3, 25),
        label: `${d}`,
        fullLabel: `${d}日`,
      });
    }
  }

  const btnCls = (v) => `pill-btn ${chartView===v ? (v==='week'?'active-green':'active-white') : 'inactive'}`;

  return `
    <div class="animate-page-enter pb-24">
      <h1 class="text-xl font-bold mb-5" style="color:var(--c-dark)">仪表盘概览</h1>

// ==================== Calendar View ====================
function renderCalendar() {
  const startHour = parseInt(getCSSVar('--timeline-start'));
  const endHour = parseInt(getCSSVar('--timeline-end'));
  const hourH = parseInt(getCSSVar('--hour-height'));

  // Header
  const monthLabel = selectedDate.toLocaleDateString('zh-CN', {year:'numeric', month:'long'});
  const weekStart = getMonday(selectedDate);

  // Month grid (if expanded)
  const today = new Date();
  const year = selectedDate.getFullYear();
  const month = selectedDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthGrid = [];
  for(let i=0;i<firstDay;i++) monthGrid.push(null);
  for(let i=1;i<=daysInMonth;i++) monthGrid.push(i);

  const headerHTML = headerExpanded ? `
    <div class="bg-white rounded-[2rem] p-5 shadow-sm mb-5 transition-all">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-bold" style="color:var(--c-dark)">${monthLabel}</h3>
        <div class="flex items-center gap-1">
          <button onclick="changeMonth(-1)" class="w-7 h-7 rounded-full bg-gray-50 text-xs flex items-center justify-center hover:bg-gray-100">‹</button>
          <button onclick="changeMonth(1)" class="w-7 h-7 rounded-full bg-gray-50 text-xs flex items-center justify-center hover:bg-gray-100">›</button>
          <button onclick="toggleHeader()" class="w-7 h-7 rounded-full bg-gray-50 text-xs flex items-center justify-center hover:bg-gray-100 ml-1">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 15 12 9 18 15"/></svg>
          </button>
        </div>
      </div>
      <div class="grid grid-cols-7 mb-2">
        ${['日','一','二','三','四','五','六'].map(d=>`<span class="text-center text-[10px] text-gray-400 font-medium py-1">${d}</span>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1">
        ${monthGrid.map((day,i)=>{
          const isToday = day && isSameDay(new Date(year,month,day), today);
          const isSel = day && isSameDay(new Date(year,month,day), selectedDate);
          const hasTask = day && tasks.some(t=> {
            const d = addDays(weekStart, (t.dayOffset||0));
            return d.getDate()===day && d.getMonth()===month;
          });
          return `<div onclick="${day?`selectDate(${year},${month},${day})`:''}" class="aspect-square rounded-full flex items-center justify-center text-xs relative cursor-pointer ${isToday?'font-bold':''} ${isSel?'text-white':(day?'text-[var(--c-dark)] hover:bg-gray-50':'')}" style="${isSel?'background:var(--c-purple)':''}">${day||''}${hasTask&&!isSel?'<span class="absolute bottom-0.5 w-1 h-1 rounded-full" style="background:var(--c-green)"></span>':''}</div>`;
        }).join('')}
      </div>
    </div>
  ` : `
    <div class="bg-white rounded-[2rem] p-4 shadow-sm mb-5 transition-all">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-bold" style="color:var(--c-dark)">${monthLabel}</h3>
        <div class="flex items-center gap-1">
          <button onclick="changeWeek(-1)" class="w-7 h-7 rounded-full bg-gray-50 text-xs flex items-center justify-center hover:bg-gray-100">‹</button>
          <button onclick="changeWeek(1)" class="w-7 h-7 rounded-full bg-gray-50 text-xs flex items-center justify-center hover:bg-gray-100">›</button>
          <button onclick="toggleHeader()" class="w-7 h-7 rounded-full bg-gray-50 text-xs flex items-center justify-center hover:bg-gray-100 ml-1">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 9 12 15 6 9"/></svg>
          </button>
        </div>
      </div>
      <div class="flex justify-between">
        ${[0,1,2,3,4,5,6].map(i=>{
          const d = addDays(weekStart, i);
          const isToday = isSameDay(d, today);
          const isSel = isSameDay(d, selectedDate);
          const hasTask = tasks.some(t=> (t.dayOffset||0) === i);
          return `
            <div onclick="selectDate(${d.getFullYear()},${d.getMonth()},${d.getDate()})" class="flex flex-col items-center gap-1 cursor-pointer py-1 px-2 rounded-xl transition-colors ${isSel?'text-white':''}" style="${isSel?'background:var(--c-purple)':''}">
              <span class="text-[10px] ${isToday&&!isSel?'font-bold text-[var(--c-purple)]':'text-gray-400'}">${['日','一','二','三','四','五','六'][i]}</span>
              <span class="text-sm font-semibold ${isToday&&!isSel?'text-[var(--c-dark)]':''}">${d.getDate()}</span>
              ${hasTask?`<span class="w-1 h-1 rounded-full ${isSel?'bg-white':'bg-[var(--c-green)]'}"></span>`:'<span class="w-1 h-1"></span>'}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  // Filter tasks for selected date
  const selDayIndex = selectedDate.getDay();
  const dayTasks = tasks.filter(t => {
    // Simulate: dayOffset maps to day of week
    return (t.dayOffset || 0) === ((selDayIndex + 6) % 7);
  });

  // Timeline
  const timelineHeight = (endHour - startHour) * hourH;
  const currentHour = today.getHours() + today.getMinutes()/60;
  const showCurrentLine = currentHour >= startHour && currentHour <= endHour;

  return `
    <div class="animate-page-enter pb-24">
      <h1 class="text-xl font-bold mb-5" style="color:var(--c-dark)">日程安排</h1>
      ${headerHTML}

      <!-- Timeline card -->
      <div class="bg-white rounded-[2rem] shadow-sm overflow-hidden">
        <div class="p-4 pb-2 flex items-center justify-between">
          <h3 class="text-sm font-bold" style="color:var(--c-dark)">${formatDate(selectedDate)} · ${dayTasks.length} 项</h3>
          <span class="text-[10px] text-gray-400">拖拽调整时间</span>
        </div>
        <div class="timeline-container relative" style="height:${timelineHeight}px;">
          <!-- Time ruler -->
          ${Array.from({length:endHour-startHour+1},(_,i)=>{
            const h = startHour + i;
            return `
              <div class="time-ruler-line" style="top:${i*hourH}px;"></div>
              <div class="time-label" style="top:${i*hourH}px;">${h}:00</div>
            `;
          }).join('')}

          <!-- Current time line -->
          ${showCurrentLine ? `<div class="current-time-line" style="top:${(currentHour-startHour)*hourH}px;"></div>` : ''}

          <!-- Task blocks -->
          ${dayTasks.map(t=>{
            const st = parseTime(t.start);
            const top = (st - startHour) * hourH;
            const h = (t.duration / 60) * hourH;
            const cls = t.colorType==='dark'?'is-dark':t.colorType==='green'?'is-green':'is-purple';
            const minH = Math.max(h, 36);
            return `
              <div class="task-block ${cls}" data-task-id="${t.id}"
                style="top:${top}px; height:${minH}px;"
                onpointerdown="onTaskPointerDown(event, ${t.id}, '${t.start}', ${t.duration})"
              >
                <div class="flex items-center gap-1.5 mb-0.5">
                  <span class="w-1.5 h-1.5 rounded-full ${t.colorType==='dark'?'bg-white/60':''}" style="${t.colorType!=='dark'?'background:var(--c-dark)':''}"></span>
                  <span class="text-xs font-semibold truncate">${t.title}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] opacity-70">${t.start} · ${t.duration}min</span>
                  <span class="text-[9px] px-1.5 py-0.5 rounded-full ${t.colorType==='dark'?'bg-white/10':'bg-black/5'} opacity-70">${t.priority==='High Priority'?'P0':t.priority==='Medium'?'P1':'P2'}</span>
                </div>
                <div class="resize-handle" onpointerdown="onResizePointerDown(event, ${t.id}, '${t.start}', ${t.duration})"></div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <!-- All-day section -->
      ${dayTasks.length===0?`
        <div class="bg-white rounded-[2rem] p-8 shadow-sm mt-4 text-center">
          <p class="text-sm text-gray-400">该日无日程安排</p>
        </div>
      `:''}
    </div>
  `;
}

// ==================== Drag Logic ====================
function onTaskPointerDown(e, taskId, start, duration) {
  if(e.target.classList.contains('resize-handle')) return;
  e.preventDefault();
  const el = e.currentTarget;
  el.classList.add('dragging');
  dragInfo = {
    id: taskId, type: 'move',
    startY: e.clientY,
    origTop: parseFloat(el.style.top),
    start: start, duration: duration,
    el: el
  };
  el.setPointerCapture(e.pointerId);
  el.onpointermove = onTaskPointerMove;
  el.onpointerup = onTaskPointerUp;
}
function onTaskPointerMove(e) {
  if(!dragInfo.el || dragInfo.type !== 'move') return;
  const dy = e.clientY - dragInfo.startY;
  dragInfo.el.style.top = (dragInfo.origTop + dy) + 'px';
}
function onTaskPointerUp(e) {
  if(!dragInfo.el) return;
  const el = dragInfo.el;
  el.classList.remove('dragging');
  el.releasePointerCapture(e.pointerId);
  el.onpointermove = null;
  el.onpointerup = null;

  // Snap to grid
  const hourH = parseInt(getCSSVar('--hour-height'));
  const startHour = parseInt(getCSSVar('--timeline-start'));
  const snapMin = parseInt(getCSSVar('--snap-min'));
  const rawTop = parseFloat(el.style.top);
  const rawHour = rawTop / hourH + startHour;
  const snappedHour = snap(rawHour, snapMin/60);
  const snappedTop = (snappedHour - startHour) * hourH;
  el.style.top = snappedTop + 'px';

  // Update task start time
  const h = Math.floor(snappedHour);
  const m = Math.round((snappedHour - h) * 60);
  const t = tasks.find(x=>x.id===dragInfo.id);
  if(t) t.start = `${pad(h)}:${pad(m)}`;

  dragInfo = { id:null, type:null, el:null };
}

function onResizePointerDown(e, taskId, start, duration) {
  e.stopPropagation();
  e.preventDefault();
  const el = e.currentTarget.closest('.task-block');
  el.classList.add('dragging');
  dragInfo = {
    id: taskId, type: 'resize',
    startY: e.clientY,
    origHeight: parseFloat(el.style.height),
    start: start, duration: duration,
    el: el
  };
  el.setPointerCapture(e.pointerId);
  el.onpointermove = onResizePointerMove;
  el.onpointerup = onResizePointerUp;
}
function onResizePointerMove(e) {
  if(!dragInfo.el || dragInfo.type !== 'resize') return;
  const dy = e.clientY - dragInfo.startY;
  dragInfo.el.style.height = Math.max(dragInfo.origHeight + dy, 36) + 'px';
}
function onResizePointerUp(e) {
  if(!dragInfo.el) return;
  const el = dragInfo.el;
  el.classList.remove('dragging');
  el.releasePointerCapture(e.pointerId);
  el.onpointermove = null;
  el.onpointerup = null;

  // Snap duration
  const hourH = parseInt(getCSSVar('--hour-height'));
  const snapMin = parseInt(getCSSVar('--snap-min'));
  const rawH = parseFloat(el.style.height);
  const rawDuration = (rawH / hourH) * 60;
  const snappedDur = Math.max(snap(rawDuration, snapMin), 15);
  el.style.height = ((snappedDur / 60) * hourH) + 'px';

  const t = tasks.find(x=>x.id===dragInfo.id);
  if(t) t.duration = snappedDur;

  dragInfo = { id:null, type:null, el:null };
}

function setTaskFilter(v) { taskFilter = v; render(); }
function openTaskModalById(id) {
  const t = tasks.find(x => x.id === id);
  if(t) openTaskModal(t);
}

function renderBoard() {
  return `<div class="animate-page-enter pb-24">
    <h1 class="text-xl font-bold mb-5" style="color:var(--c-dark)">看板</h1>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <div class="text-xs font-bold text-gray-400 mb-2">项目待办</div>
        ${tasks.filter(t=>t.priority==='High Priority').map(t=>`
          <div class="p-3 rounded-2xl bg-white shadow-sm mb-2 text-sm" style="color:var(--c-dark)">${t.title}</div>

      <div>
        <div class="text-xs font-bold text-gray-400 mb-2">个人待办</div>
        ${tasks.filter(t=>t.priority!=='High Priority').map(t=>`
          <div class="p-3 rounded-2xl bg-white shadow-sm mb-2 text-sm" style="color:var(--c-dark)">${t.title}</div>

// ==================== Main Render ====================
function render() {
  const area = document.getElementById('contentArea');
  if(currentTab === 'dashboard') area.innerHTML = renderDashboard();
  else if(currentTab === 'tasks') area.innerHTML = renderTasks();
  else if(currentTab === 'board') area.innerHTML = renderBoard();
  else if(currentTab === 'calendar') area.innerHTML = renderCalendar();
  else area.innerHTML = renderSparks();
  updateNav();
}

// ==================== Param Panel ====================
function onParamChange() {
  const hourH = document.getElementById('paramHourHeight').value;
  const startH = document.getElementById('paramStartHour').value;
  const endH = document.getElementById('paramEndHour').value;
  const snap = document.getElementById('paramSnap').value;
  const taskR = document.getElementById('paramTaskRadius').value;

  setCSSVar('--hour-height', hourH + 'px');
  setCSSVar('--timeline-start', startH);
  setCSSVar('--timeline-end', endH);
  setCSSVar('--snap-min', snap);
  setCSSVar('--task-block-radius', taskR + 'px');

  document.getElementById('valHourHeight').textContent = hourH + 'px';
  document.getElementById('valStartHour').textContent = startH + ':00';
  document.getElementById('valEndHour').textContent = endH + ':00';
  document.getElementById('valSnap').textContent = snap + 'min';
  document.getElementById('valTaskRadius').textContent = taskR + 'px';

  if(currentTab === 'calendar') render();
}

function togglePanel() {
  const p = document.getElementById('paramPanel');
  p.classList.toggle('collapsed');
  const icon = document.getElementById('collapseIcon');
  if(p.classList.contains('collapsed')) {
    icon.innerHTML = '<polyline points="9 18 15 12 9 6"/>';
  } else {
    icon.innerHTML = '<polyline points="15 18 9 12 15 6"/>';
  }
}

function resetParams() {
  document.getElementById('paramHourHeight').value = 80;
  document.getElementById('paramStartHour').value = 7;
  document.getElementById('paramEndHour').value = 23;
  document.getElementById('paramSnap').value = 15;
  document.getElementById('paramTaskRadius').value = 14;
  headerExpanded = true;
  const btn = document.getElementById('headerToggle');
  const knob = document.getElementById('headerToggleKnob');
  const label = document.getElementById('valHeader');
  btn.style.background = 'var(--c-green)'; knob.style.left = '22px'; label.textContent = '展开';
  onParamChange();
  setDefaultChart('week');
  render();
}

function exportJSON() {
  const payload = {
    project: 'sparkflow',
    prototypeVersion: 'v4',
    exportedAt: new Date().toISOString(),
    params: {
      hourHeight: document.getElementById('paramHourHeight').value + 'px',
      timelineStartHour: parseInt(document.getElementById('paramStartHour').value),
      timelineEndHour: parseInt(document.getElementById('paramEndHour').value),
      snapMinutes: parseInt(document.getElementById('paramSnap').value),
      taskBlockRadius: document.getElementById('paramTaskRadius').value + 'px',
      calendarHeaderDefaultExpanded: headerExpanded,
      chartDefaultView: defaultChartView,
    },
    colors: {
      dark: '#242424',
      green: '#cae393',
      purple: '#b0a8db',
      bg: '#f4f4f6',
    },
    deviceTarget: 'redmi-k70',
    viewportCSS: '393×852',
    notes: 'V4 原型：Dashboard 日/周/月切换 + 柱状图下钻；Calendar 时间线 + 拖拽 + 日历头伸缩。参数调参完成后导出供正式版读取。'
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sparkflow-v4-dashboard-calendar-params.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ==================== Init ====================
render();
</script>
