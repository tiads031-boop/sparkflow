name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Report existing lint debt
        continue-on-error: true
        run: npm run lint

  api:
    name: API build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sparkflow
          POSTGRES_PASSWORD: sparkflow
          POSTGRES_DB: sparkflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sparkflow -d sparkflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sparkflow:sparkflow@localhost:5432/sparkflow_ci?schema=public
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Apply Prisma migrations on fresh PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify Prisma migration status
        run: npx prisma migrate status
      - run: npm run build
      - run: npm test -- --runInBand
      - name: Verify course import idempotency on PostgreSQL
        run: npm run test:e2e -- --runInBand course-import-postgres
