name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm test -- --run
      - name: Verify Android production API target
        run: grep -Fxq 'VITE_API_BASE_URL=https://api.fish-life.cc.cd/api' .env.production
      - run: npm run build
      - name: Verify production API is embedded in bundle
        run: grep -R -Fq 'https://api.fish-life.cc.cd/api' dist
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Stamp APK with commit SHA
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          mv android/app/build/outputs/apk/debug/app-debug.apk \
            "android/app/build/outputs/apk/debug/sparkflow-${SHORT_SHA}-debug.apk"
          sha256sum android/app/build/outputs/apk/debug/sparkflow-*-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sparkflow-android-debug-${{ github.sha }}
          path: web/android/app/build/outputs/apk/debug/sparkflow-*-debug.apk
          if-no-files-found: error
          retention-days: 14
